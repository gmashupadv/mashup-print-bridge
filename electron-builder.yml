appId: com.mashupadv.print-bridge
productName: Mashup Print Bridge
copyright: Copyright © 2026 Mashup ADV

directories:
  output: dist-electron-builder

# resources/ deve viaggiare nell'asar: gli import `?asset` di electron-vite
# emettono percorsi relativi a out/ che puntano a app.asar/resources/*
files:
  - out/**/*
  - resources/**/*
  - package.json

publish:
  provider: github
  owner: gmashupadv
  repo: mashup-print-bridge
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico

nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true

mac:
  target:
    # dmg = primo install; zip = file che electron-updater scarica per gli aggiornamenti su macOS
    # (senza zip, latest-mac.yml punterebbe a un file inesistente). La firma Developer ID
    # resta necessaria per l'auto-update silenzioso; senza, l'app fa solo check + download manuale.
    #
    # universal = UN solo binario che gira nativo sia su Intel sia su Apple Silicon: niente
    # Rosetta, niente rischio di scaricare il dmg con l'architettura sbagliata. Pesa ~2× perché
    # contiene entrambe le architetture, ma per un'app da tray è irrilevante.
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: resources/icon.png
  category: public.app-category.utilities

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Utility
